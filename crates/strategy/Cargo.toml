[package]
name = "tickglide-strategy"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Trait surface and test harness for writing market-signal generators in the TickGlide ecosystem"
keywords = ["trading", "finance", "signals", "strategy"]
categories = ["finance"]
readme = "README.md"

[features]
